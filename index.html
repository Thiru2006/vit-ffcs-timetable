<style>
/* Layout: sticky summary bar on top; two columns (controls | timetable) that stack on phones.
   Palette = refined take on the VIT grid (lavender theory / sky lab / indigo accent), theme-aware. */
:root{
  --bg:#f5f5fa; --surface:#ffffff; --surface-2:#f1f0f8; --surface-3:#e9e8f3;
  --fg:#18171f; --muted:#6a6879; --faint:#a7a5b6; --border:#e3e1ee; --border-strong:#cfcce0;
  --accent:#574bd4; --accent-weak:#eceafb; --accent-ink:#3a2fa8;
  --theory:#e9e4fb; --theory-ink:#4a3fb0;
  --lab:#dcecfa; --lab-ink:#1f5f94;
  --ok:#17935f; --ok-weak:#e3f5ec;
  --clash:#df2f4d; --clash-weak:#fce6ea; --clash-ink:#b11e38;
  --shadow:0 1px 2px rgba(20,18,40,.06),0 6px 20px rgba(20,18,40,.05);
  --font:"Archivo","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101016; --surface:#1a1a23; --surface-2:#22222e; --surface-3:#2a2a38;
  --fg:#ececf4; --muted:#9b99ad; --faint:#67657a; --border:#2d2c3b; --border-strong:#3b3a4d;
  --accent:#9a8bff; --accent-weak:#262142; --accent-ink:#c3b9ff;
  --theory:#322b57; --theory-ink:#c3b8ff;
  --lab:#1d3650; --lab-ink:#86c2f1;
  --ok:#38c38a; --ok-weak:#16291f;
  --clash:#ff6a83; --clash-weak:#3a1c24; --clash-ink:#ff93a5;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101016; --surface:#1a1a23; --surface-2:#22222e; --surface-3:#2a2a38;
  --fg:#ececf4; --muted:#9b99ad; --faint:#67657a; --border:#2d2c3b; --border-strong:#3b3a4d;
  --accent:#9a8bff; --accent-weak:#262142; --accent-ink:#c3b9ff;
  --theory:#322b57; --theory-ink:#c3b8ff;
  --lab:#1d3650; --lab-ink:#86c2f1;
  --ok:#38c38a; --ok-weak:#16291f;
  --clash:#ff6a83; --clash-weak:#3a1c24; --clash-ink:#ff93a5;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:21}
.topbar .wrap{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:auto;min-width:0}
.brand h1{font-size:18px;font-weight:800}
.brand .sub{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.stat{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1;gap:2px}
.stat b{font-family:var(--mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.stat.bad b{color:var(--clash)} .stat.good b{color:var(--ok)}
.iconbtn{background:var(--surface-2);border:1px solid var(--border);color:var(--fg);border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.iconbtn:hover{border-color:var(--border-strong);background:var(--surface-3)}

/* banner */
.banner{margin-top:12px;border-radius:12px;padding:10px 14px;font-size:13px;display:flex;gap:9px;align-items:flex-start}
.banner.clash{background:var(--clash-weak);color:var(--clash-ink);border:1px solid color-mix(in srgb,var(--clash) 35%,transparent)}
.banner.ok{background:var(--ok-weak);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent)}
.banner b{font-weight:700}
.banner ul{margin:5px 0 0;padding-left:16px}
.banner li{margin:2px 0}

/* layout */
.layout{display:grid;grid-template-columns:385px minmax(0,1fr);gap:20px;align-items:start;padding-block:18px 36px}
@media(max-width:860px){.layout{grid-template-columns:1fr}.right{order:-1}}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.panel.pad{padding:14px}
.ptitle{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}

/* search */
.search{position:relative}
.search input{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--fg);border-radius:10px;padding:11px 12px 11px 34px;font-size:14px;font-family:inherit}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.filterrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

.results{margin-top:12px;max-height:min(460px,56vh);overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px}
.crow{text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;display:flex;gap:10px;align-items:center}
.crow:hover{border-color:var(--accent);background:var(--accent-weak)}
.crow:disabled{opacity:.5;cursor:default}
.crow .cc{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent-ink);white-space:nowrap}
.crow .ct{font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.crow .cm{font-size:10px;color:var(--muted);display:flex;gap:5px;align-items:center;white-space:nowrap}
.tag{font-size:9.5px;font-weight:700;padding:2px 5px;border-radius:5px;text-transform:uppercase;letter-spacing:.04em}
.tag.lab{background:var(--lab);color:var(--lab-ink)}
.tag.added{background:var(--ok);color:#fff}
.empty{font-size:12.5px;color:var(--muted);text-align:center;padding:26px 10px}

/* detail / section picker */
.back{background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:600;padding:0;display:inline-flex;gap:5px;align-items:center;margin-bottom:10px}
.dhead{margin-bottom:4px}
.dhead .dc{font-family:var(--mono);font-size:12px;color:var(--accent-ink);font-weight:600}
.dhead h3{font-size:15.5px;margin:2px 0 3px}
.dhead .dm{font-size:11.5px;color:var(--muted)}
.note{font-size:11.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:8px 10px;margin:11px 0}
.note b{color:var(--fg)}
.secls{display:flex;flex-direction:column;gap:6px;margin-top:4px;max-height:min(430px,52vh);overflow-y:auto;padding-right:2px}
.sec{width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;display:grid;grid-template-columns:auto 1fr auto;gap:3px 10px;align-items:center}
.sec:hover{border-color:var(--accent);background:var(--accent-weak)}
.sec .dot{grid-row:span 2;width:9px;height:9px;border-radius:50%;align-self:center}
.sec .dot.ok{background:var(--ok)} .sec .dot.clash{background:var(--clash)}
.sec .fac{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec .sl{font-family:var(--mono);font-size:11.5px;color:var(--accent-ink);text-align:right;font-weight:600}
.sec .mt{font-size:10.5px;color:var(--muted);grid-column:2/4;display:flex;gap:8px;flex-wrap:wrap}
.sec .mt .cw{color:var(--clash-ink);font-weight:600}

/* selected list */
.selist{display:flex;flex-direction:column;gap:9px}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 12px;box-shadow:var(--shadow)}
.scard.clash{border-color:var(--clash);box-shadow:0 0 0 1px var(--clash) inset,var(--shadow)}
.scard .sh{display:flex;gap:9px;align-items:baseline}
.scard .sh .cc{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent-ink)}
.scard .sh .ct{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scard .sh .rm{background:none;border:none;color:var(--faint);font-size:17px;line-height:1;padding:0 2px}
.scard .sh .rm:hover{color:var(--clash)}
.scard .clashflag{font-size:10.5px;font-weight:700;color:var(--clash-ink);margin-top:5px;display:flex;gap:5px;align-items:center}
.selrow{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;margin-top:8px}
.selrow .lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding-top:3px}
.selrow select{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--fg);border-radius:8px;padding:6px 7px;font-size:11.5px;font-family:var(--mono)}
.selrow select:focus{outline:2px solid var(--accent);outline-offset:1px}
.selrow .ro{font-size:10.5px;color:var(--muted);font-family:var(--mono);padding-top:4px}
.minor{font-size:11px;color:var(--muted);margin-top:6px}

/* timetable */
.ttwrap{overflow-x:auto;border-radius:14px;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow)}
table.tt{border-collapse:collapse;width:100%;min-width:900px;font-variant-numeric:tabular-nums}
.tt th,.tt td{border:1px solid var(--border);padding:0}
.tt thead th{background:var(--surface-2);font-size:9.5px;font-weight:600;color:var(--muted);padding:5px 3px;text-align:center;line-height:1.3;font-family:var(--mono)}
.tt thead tr.thh th{background:var(--theory);color:var(--theory-ink)}
.tt thead tr.thl th{background:var(--lab);color:var(--lab-ink)}
.tt .daycol{background:var(--surface-2);font-weight:800;font-size:12px;text-align:center;width:46px;color:var(--fg);letter-spacing:.03em}
.tt .lunch{background:var(--surface-3);color:var(--faint);writing-mode:vertical-rl;text-orientation:upright;font-size:9px;font-weight:700;letter-spacing:.14em;width:20px}
.cell{height:50px;vertical-align:middle;text-align:center;position:relative;padding:2px!important}
.cell .base{font-size:8.5px;color:var(--faint);font-family:var(--mono);letter-spacing:.02em}
.cell.occ{cursor:default}
.ev{display:block;border-radius:5px;padding:3px 2px;margin:1px 0;line-height:1.15}
.ev .ec{font-family:var(--mono);font-size:10px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .es{font-size:8px;opacity:.8;letter-spacing:.02em}
.ev.th{background:var(--theory);color:var(--theory-ink)}
.ev.lb{background:var(--lab);color:var(--lab-ink)}
.ev.clash{background:var(--clash);color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:11px;font-size:11px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:5px;align-items:center}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.foot{font-size:11px;color:var(--muted);margin-top:16px;line-height:1.6}
.foot code{font-family:var(--mono);background:var(--surface-2);padding:1px 4px;border-radius:4px;font-size:10.5px}
.loading{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px}
.otherslots{margin-top:12px}
.obadge{display:inline-flex;gap:6px;align-items:center;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:5px 9px;font-size:11px;margin:3px 4px 0 0}
.obadge .oc{font-family:var(--mono);color:var(--accent-ink);font-weight:600}
.obadge.clash{border-color:var(--clash);color:var(--clash-ink)}
</style>
</head>

<script>

const DAYS=["MON","TUE","WED","THU","FRI"];

 A1:[[0,1],[2,2]],A2:[[0,7],[2,8]],B1:[[1,1],[3,2]],B2:[[1,7],[3,8]],

};
// base labels per cell
const baseTheory={},baseLab={};
for(const t in THEORY)for(const[d,c]of THEORY[t])baseTheory[d+"-"+c]=t;
let ln=1;
for(let d=0;d<5;d++)for(let c=1;c<=6;c++){baseLab[d+"-"+c]="L"+ln;ln++;}
for(let d=0;d<5;d++)for(let c=7;c<=12;c++){baseLab[d+"-"+c]="L"+ln;ln++;}
const Slabels={"0-6":"S11","4-6":"S15","0-12":"S3","1-12":"S1","2-12":"S4","3-12":"S2"};

/* ---------- state ---------- */
let DATA=null, byCode={}, compById={};
let state={selected:[]};   // [{code,pid,lid}]
let filterSchool=null, curDetail=null;

const LS="vit-ffcs-tt-v1";
function save(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
function load(){try{const s=localStorage.getItem(LS);if(s)state=JSON.parse(s);}catch(e){}}

/* ---------- boot ---------- */
load();
function init(d){
  DATA=d;
  for(const co of d.courses){
    byCode[co.code]=co;
    for(const p of co.primaries)compById[p.id]={comp:p,course:co,role:"primary"};
    for(const f in co.labsByFac)for(const l of co.labsByFac[f])compById[l.id]={comp:l,course:co,role:"lab"};
  }
  // prune any stale saved ids
  state.selected=state.selected.filter(s=>byCode[s.code]&&compById[s.pid]);
  const lm=document.getElementById("loadingMsg");if(lm)lm.hidden=true;
  buildSchoolFilter();
  renderAll();
}
if(window.COURSE_DATA){init(window.COURSE_DATA);}
else{const lm=document.getElementById("loadingMsg");if(lm)lm.textContent="Could not load course data. Try reopening the page.";}

/* ---------- helpers ---------- */

  const p=compById[sel.pid].comp;
  let cs=p.cells.slice();
  if(sel.lid!=null&&compById[sel.lid])cs=cs.concat(compById[sel.lid].comp.cells);
  return cs;
}
function occupancy(except){ // cell -> [selIndex]
  const m={};
  state.selected.forEach((s,i)=>{
    if(i===except)return;
    for(const c of cellsOf(s))(m[c]=m[c]||[]).push(i);
  });
  return m;
}
function clashInfo(){
  const m={};
  state.selected.forEach((s,i)=>{for(const c of cellsOf(s))(m[c]=m[c]||[]).push(i);});
  const clashCells=new Set(), clashOf=state.selected.map(()=>new Set());
  const pairs=[];
  for(const c in m){ if(m[c].length>1){clashCells.add(c);
    for(const i of m[c])for(const j of m[c])if(i<j){clashOf[i].add(j);clashOf[j].add(i);}
  }}
  return {cellMap:m,clashCells,clashOf};
}
function autoLab(course,fac,exceptIdx){
  if(!course.hasLab)return null;
  const labs=course.labsByFac[fac];
  if(!labs||!labs.length)return null;
  const occ=occupancy(exceptIdx);
  const prim=course.primaries.find(p=>p.fac===fac);
  const primCells=new Set(prim?prim.cells:[]);
  // prefer a lab that clashes with nothing current and not with its own theory
  let best=null;
  for(const l of labs){
    const bad=l.cells.some(c=>occ[c]||primCells.has(c));
    if(!bad)return l.id;
    if(best===null)best=l.id;
  }
  return best;
}
const roleName={ETH:"Theory",TH:"Theory",SS:"Soft Skill",OC:"Online",PJT:"Project",EPJ:"Project",ESD:"Studio",EOP:"Studio",LO:"Lab",ELA:"Lab"};

/* ---------- search / results ---------- */
function buildSchoolFilter(){
  const counts={};
  for(const co of DATA.courses)counts[co.school]=(counts[co.school]||0)+1;
  const schools=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).slice(0,7);
  const el=document.getElementById("schoolFilter");
  el.innerHTML="";
  const mk=(name,label)=>{const b=document.createElement("button");b.className="chip"+(filterSchool===name?" on":"");b.textContent=label;b.onclick=()=>{filterSchool=filterSchool===name?null:name;buildSchoolFilter();renderResults();};el.appendChild(b);};
  mk(null,"All");
  schools.forEach(s=>mk(s,s));
}
function renderResults(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const box=document.getElementById("results");
  box.innerHTML="";
  const added=new Set(state.selected.map(s=>s.code));
  let list=DATA.courses;
  if(filterSchool)list=list.filter(c=>c.school===filterSchool);
  if(q){const terms=q.split(/\s+/);list=list.filter(c=>{const h=(c.code+" "+c.title).toLowerCase();return terms.every(t=>h.includes(t));});}
  list=list.slice(0,200);
  if(!list.length){box.innerHTML='<div class="empty">No courses match your search.</div>';return;}
  for(const co of list){
    const b=document.createElement("button");
    b.className="crow";
    const isAdded=added.has(co.code);
    b.innerHTML=`<span class="cc">${co.code}</span><span class="ct">${co.title}</span><span class="cm">${co.hasLab?'<span class="tag lab">lab</span>':''}${isAdded?'<span class="tag added">added</span>':'<b style="font-family:var(--mono);color:var(--muted)">'+co.cr+'cr</b>'}</span>`;
    b.onclick=()=>openDetail(co.code);
    box.appendChild(b);
  }
}

/* ---------- detail / section picker ---------- */
function openDetail(code){
  curDetail=code;
  document.getElementById("searchView").hidden=true;
  const dv=document.getElementById("detailView");
  dv.hidden=false;
  renderDetail();
}
function closeDetail(){
  curDetail=null;
  document.getElementById("detailView").hidden=true;
  document.getElementById("searchView").hidden=false;
  renderResults();
}
function renderDetail(){
  const co=byCode[curDetail];
  const dv=document.getElementById("detailView");
  const occ=occupancy(-1);
  const already=state.selected.find(s=>s.code===co.code);
  let secs=co.primaries.slice().sort((a,b)=>(a.fac+a.slot).localeCompare(b.fac+b.slot));
  let labNote="";
  if(co.hasLab)labNote=`<div class="note">This course has a <b>lab</b>. When you pick a section, the lab from the <b>same faculty</b> is attached automatically — you can switch between that faculty's lab slots afterward.</div>`;
  let rows="";
  for(const p of secs){
    const labs=co.hasLab?(co.labsByFac[p.fac]||[]):[];
    // tentative cells: theory + a best lab
    let tcells=p.cells.slice();
    if(co.hasLab&&labs.length){const lid=autoLab(co,p.fac,-1);if(lid!=null)tcells=tcells.concat(compById[lid].comp.cells);}
    const hit=new Set();
    tcells.forEach(c=>{if(occ[c])occ[c].forEach(i=>hit.add(state.selected[i].code));});
    const ok=hit.size===0;
    const labTxt=co.hasLab?(labs.length?`· ${labs.length} lab slot${labs.length>1?'s':''}`:'· <span class="cw">no same-faculty lab</span>'):'';
    const clashTxt=ok?'':`<span class="cw">⚠ clashes with ${[...hit].join(", ")}</span>`;
    rows+=`<button class="sec" data-pid="${p.id}"><i class="dot ${ok?'ok':'clash'}"></i>`+
      `<span class="fac">${p.fac||'—'}</span><span class="sl">${p.slot}</span>`+
      `<span class="mt"><span>${roleName[p.type]||p.type}</span><span>${p.room||''}</span><span>${p.cr}cr</span>${labTxt?'<span>'+labTxt+'</span>':''}${clashTxt}</span></button>`;
  }
  dv.innerHTML=`<button class="back" id="backBtn">‹ Back to search</button>`+
    `<div class="dhead"><div class="dc">${co.code} · ${co.school} · ${co.cr} credits</div><h3>${co.title}</h3>`+
    `<div class="dm">${co.primaries.length} section${co.primaries.length>1?'s':''} offered${already?' · already in your plan':''}</div></div>`+
    labNote+`<div class="secls">${rows}</div>`;
  dv.querySelector("#backBtn").onclick=closeDetail;
  dv.querySelectorAll(".sec").forEach(b=>b.onclick=()=>addCourse(co.code,+b.dataset.pid));
}

/* ---------- add / modify / remove ---------- */
function addCourse(code,pid){
  const co=byCode[code];
  const existing=state.selected.findIndex(s=>s.code===code);
  const fac=compById[pid].comp.fac;
  const lid=autoLab(co,fac,existing);
  const entry={code,pid,lid};
  if(existing>=0)state.selected[existing]=entry;
  else state.selected.push(entry);
  save();closeDetail();renderAll();
}
function removeSel(i){state.selected.splice(i,1);save();renderAll();}
function changeSection(i,pid){
  const s=state.selected[i];const co=byCode[s.code];
  s.pid=+pid;s.lid=autoLab(co,compById[s.pid].comp.fac,i);
  save();renderAll();
}
function changeLab(i,lid){state.selected[i].lid=lid===""?null:+lid;save();renderAll();}

/* ---------- selected list ---------- */
function renderSelected(ci){
  const box=document.getElementById("selist");
  box.innerHTML="";
  document.getElementById("selCount").textContent=state.selected.length?state.selected.length:"";
  if(!state.selected.length){box.innerHTML='<div class="empty">No courses yet. Search on the left and pick a section to build your timetable.</div>';return;}
  state.selected.forEach((s,i)=>{
    const co=byCode[s.code];const p=compById[s.pid].comp;
    const card=document.createElement("div");
    const isClash=ci.clashOf[i].size>0;
    card.className="scard"+(isClash?" clash":"");
    let clashNames=[...ci.clashOf[i]].map(j=>state.selected[j].code);
    // section options
    const secOpts=co.primaries.slice().sort((a,b)=>(a.fac+a.slot).localeCompare(b.fac+b.slot))
      .map(o=>`<option value="${o.id}"${o.id===s.pid?' selected':''}>${o.slot} · ${o.fac||'—'}</option>`).join("");
    let html=`<div class="sh"><span class="cc">${co.code}</span><span class="ct">${co.title}</span><button class="rm" title="Remove" data-rm="${i}">×</button></div>`;
    if(isClash)html+=`<div class="clashflag">⚠ Clashes with ${clashNames.join(", ")}</div>`;
    html+=`<div class="selrow"><span class="lbl">${co.hasLab?'Thry':'Slot'}</span><select data-sec="${i}">${secOpts}</select></div>`;
    html+=`<div class="selrow"><span class="lbl">Room</span><span class="ro">${p.room||'—'} · ${p.slot} · ${p.cr}cr</span></div>`;
    if(co.hasLab){
      const labs=co.labsByFac[p.fac]||[];
      if(labs.length){
        const labOpts=labs.map(l=>`<option value="${l.id}"${l.id===s.lid?' selected':''}>${l.slot} · ${l.room||''}</option>`).join("");
        html+=`<div class="selrow"><span class="lbl">Lab</span><select data-lab="${i}">${labOpts}</select></div>`;
      }else{
        html+=`<div class="minor">⚠ No lab section under ${p.fac||'this faculty'}. Pick another section for a same-faculty lab.</div>`;
      }
    }
    card.innerHTML=html;
    card.querySelector("[data-rm]").onclick=()=>removeSel(i);
    const secS=card.querySelector("[data-sec]");if(secS)secS.onchange=e=>changeSection(i,e.target.value);
    const labS=card.querySelector("[data-lab]");if(labS)labS.onchange=e=>changeLab(i,e.target.value);
    box.appendChild(card);
  });
}

/* ---------- timetable grid ---------- */
function renderGrid(ci){
  const tt=document.getElementById("tt");
  // event map cell -> [{code,type,isLab}]
  const evm={};
  state.selected.forEach((s,i)=>{
    const p=compById[s.pid].comp;
    p.cells.forEach(c=>{if(c.indexOf("slot:")!==0)(evm[c]=evm[c]||[]).push({code:s.code,isLab:false,fac:p.fac,room:p.room,slot:baseTheory[c]||p.slot});});
    if(s.lid!=null&&compById[s.lid]){const l=compById[s.lid].comp;l.cells.forEach(c=>{if(c.indexOf("slot:")!==0)(evm[c]=evm[c]||[]).push({code:s.code,isLab:true,fac:l.fac,room:l.room,slot:baseLab[c]||l.slot});});}
  });
  let h="<thead>";
  // theory time row
  h+='<tr class="thh"><th class="daycol" rowspan="2" style="background:var(--surface-2)">Day</th>';
  for(let c=1;c<=12;c++){h+=`<th>${TIMES[c]}</th>`;if(c===6)h+='<th rowspan="2" class="lunch">LUNCH</th>';}
  h+="</tr>";
  h+='<tr class="thl">';
  for(let c=1;c<=12;c++)h+=`<th>Lab</th>`;
  h+="</tr></thead><tbody>";
  for(let d=0;d<5;d++){
    h+=`<tr><td class="daycol">${DAYS[d]}</td>`;
    for(let c=1;c<=12;c++){
      const key=d+"-"+c;
      const evs=evm[key]||[];
      const clash=ci.clashCells.has(key)&&evs.length>1;
      let inner="";
      if(evs.length){
        inner=evs.map(e=>{const cls=clash?"clash":(e.isLab?"lb":"th");return `<span class="ev ${cls}" title="${e.code} · ${e.fac||''} · ${e.room||''}"><span class="ec">${e.code}</span><span class="es">${e.slot}${e.isLab?'':' '}</span></span>`;}).join("");
      }else{
        const th=baseTheory[key],lb=baseLab[key],sl=Slabels[key];
        inner=`<span class="base">${sl?sl:(th||'')}${(th||sl)?' / ':''}${lb||''}</span>`;
      }
      h+=`<td class="cell${evs.length?' occ':''}">${inner}</td>`;
      if(c===6)h+=`<td class="lunch"></td>`;
    }
    h+="</tr>";
  }
  h+="</tbody>";
  tt.innerHTML=h;
}

/* ---------- other (non-grid) slots ---------- */
function renderOther(ci){
  const box=document.getElementById("otherslots");
  const items=[];
  state.selected.forEach((s,i)=>{
    const p=compById[s.pid].comp;
    const nong=p.cells.filter(c=>c.indexOf("slot:")===0);
    const isNil=p.cells.length===0;
    if(nong.length||isNil){
      items.push({code:s.code,slot:isNil?"No fixed timetable slot":p.slot,clash:ci.clashOf[i].size>0,i});
    }
  });
  if(!items.length){box.innerHTML="";return;}
  box.innerHTML=`<div class="ptitle" style="margin:4px 0 6px">Off-grid / program slots</div>`+
    items.map(it=>`<span class="obadge${it.clash?' clash':''}"><span class="oc">${it.code}</span> ${it.slot}</span>`).join("")+
    `<div class="minor">These use the law-school / postgraduate slot systems (not on the B.Tech grid above). Clash checks still run by shared slot code.</div>`;
}

/* ---------- banner & stats ---------- */
function renderBanner(ci){
  const b=document.getElementById("banner");
  const nClashPairs=new Set();
  state.selected.forEach((s,i)=>ci.clashOf[i].forEach(j=>nClashPairs.add(i<j?i+"-"+j:j+"-"+i)));
  const credits=state.selected.reduce((t,s)=>{const p=compById[s.pid].comp;let c=p.cr;if(s.lid!=null&&compById[s.lid])c+=compById[s.lid].comp.cr;return t+c;},0);
  document.getElementById("stCourses").textContent=state.selected.length;
  document.getElementById("stCredits").textContent=credits;
  document.getElementById("stClash").textContent=nClashPairs.size;
  document.getElementById("stClashWrap").className="stat"+(nClashPairs.size?" bad":" good");
  if(!state.selected.length){b.innerHTML="";return;}
  if(nClashPairs.size){
    const lines=[...nClashPairs].map(k=>{const[i,j]=k.split("-").map(Number);
      const shared=cellsOf(state.selected[i]).filter(c=>cellsOf(state.selected[j]).includes(c));
      const where=shared.map(c=>{const d=c.split("-");if(c.indexOf("slot:")===0)return c.slice(5);return DAYS[+d[0]]+" "+TIMES[+d[1]];}).filter((v,ix,a)=>a.indexOf(v)===ix);
      return `<b>${state.selected[i].code}</b> × <b>${state.selected[j].code}</b> — ${where.join(", ")}`;});
    b.innerHTML=`<div class="banner clash"><span>⚠</span><div><b>${nClashPairs.size} clash${nClashPairs.size>1?'es':''} detected.</b> Change a faculty/section or lab slot to resolve:<ul>${lines.map(l=>'<li>'+l+'</li>').join("")}</ul></div></div>`;
  }else{
    b.innerHTML=`<div class="banner ok"><span>✓</span><div>No clashes — your timetable is clean across ${state.selected.length} course${state.selected.length>1?'s':''} and ${credits} credits.</div></div>`;
  }
}

function renderAll(){
  if(!DATA)return;
  const ci=clashInfo();
  renderBanner(ci);
  if(curDetail)renderDetail();else renderResults();
  renderSelected(ci);
  renderGrid(ci);
  renderOther(ci);
  document.getElementById("foot").innerHTML=`Parsed from the official <b>Winter Semester 2026–27 Course Offered List</b> (718 courses). Lab is paired with the same faculty as the theory, per your rule. Your selection is saved in this browser. Always confirm final slots in the VTOP course registration portal.`;
}

/* ---------- controls ---------- */
document.getElementById("q").addEventListener("input",()=>{if(curDetail)closeDetail();renderResults();});
document.getElementById("clearBtn").onclick=()=>{if(state.selected.length){state.selected=[];save();renderAll();}};
document.getElementById("themeBtn").onclick=()=>{
  const r=document.documentElement;
  const cur=r.getAttribute("data-theme");
  const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.setAttribute("data-theme",dark?"light":"dark");
};
</script>
